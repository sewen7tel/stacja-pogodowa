name: Stacja pogodowa

on:
  schedule:
    - cron: "17 * * * *"      # co godzinę (GitHub bywa opóźniony o kilka–kilkanaście minut)
  workflow_dispatch:          # ręczne uruchomienie: Actions → Stacja pogodowa → Run workflow
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stacja
  cancel-in-progress: false

jobs:
  aktualizacja:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Odtwórz archiwum z gałęzi „dane”
        run: |
          if git ls-remote --exit-code --heads origin dane >/dev/null; then
            git fetch -q origin dane --depth=1
            git archive FETCH_HEAD dane | tar -x
          fi
          mkdir -p dane

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/stacja.yml

      - run: pip install requests pandas tzdata

      - name: Synchronizacja i dashboard
        env:
          ECOWITT_APP_KEY: ${{ secrets.ECOWITT_APP_KEY }}
          ECOWITT_API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          ECOWITT_MAC: ${{ secrets.ECOWITT_MAC }}
          STACJA_NAZWA: ${{ vars.STACJA_NAZWA || 'Stacja pogodowa – Szczecin' }}
        run: python stacja_pogodowa.py --publiczny --wyjscie strona/index.html || echo "::warning::Synchronizacja zakończona z błędami – szczegóły w logu"

      - name: Zapisz archiwum (gałąź „dane”, zawsze jeden commit)
        if: always()
        run: |
          git config user.name "stacja-bot"
          git config user.email "stacja-bot@users.noreply.github.com"
          tmp=$(mktemp -d)
          cp -r dane "$tmp/"
          cd "$tmp"
          git init -q -b dane
          git add -A
          git commit -qm "Archiwum $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dane

      - name: Podtrzymanie harmonogramu (GitHub wyłącza go po 60 dniach bez commitów)
        run: |
          ost=$(git log -1 --format=%ct origin/main)
          if [ $(( $(date +%s) - ost )) -gt $(( 45 * 86400 )) ]; then
            git commit --allow-empty -qm "Podtrzymanie harmonogramu"
            git push -q origin HEAD:main
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: strona

      - id: deploy
        uses: actions/deploy-pages@v4
